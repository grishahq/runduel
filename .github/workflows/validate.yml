name: Validate RunDuel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: python -m pip install -r examples/requirements.lock
      - name: Start deterministic real AgentOS
        run: |
          mkdir -p .tmp
          AGNO_TELEMETRY=false python examples/offline_agentos.py > .tmp/agentos.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:7777/health; then exit 0; fi
            sleep 1
          done
          cat .tmp/agentos.log
          exit 1
      - run: pnpm test:e2e
